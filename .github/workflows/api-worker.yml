name: API Worker

on:
  push:
    branches: [main]
    paths: ['packages/api-worker/**', 'api/openapi.json', '.github/workflows/api-worker.yml']
  pull_request:
    paths: ['packages/api-worker/**', 'api/openapi.json', '.github/workflows/api-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routes:
    name: API Worker native subset
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Check out the qualified SDK
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: opentideconstants/sdk
          ref: eecc663b9cb2afeb297b8c0f9c1dafebb69502f3
          path: .sdk
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde # v1
        with:
          ruby-version: '3.2'
      - name: Install locked SDK build dependencies
        run: npm ci --ignore-scripts
        working-directory: .sdk/js
      - name: Build the pinned SDK package
        run: npm run build
        working-directory: .sdk/js
      - name: Pack the pinned SDK into the relative Worker dependency
        run: ruby packages/api-worker/proof/package.rb --sdk .sdk --prepare-sdk
      - name: Install locked Worker dependencies
        run: npm ci --ignore-scripts
        working-directory: packages/api-worker
      - name: Typecheck the Worker
        run: npm run typecheck
        working-directory: packages/api-worker
      - name: Build the Worker without deploying
        run: npm run build
        working-directory: packages/api-worker
      # Seven existing complete native records, not a full-release qualification.
      # The separately retained local proof uses the pinned 475,953,736-byte release.
      - name: Compare real HTTP routes with Python on the native subset
        run: >-
          ruby packages/api-worker/proof/routes.rb --phase green --sdk .sdk
          --release-dir .sdk/conformance/current-data --ci-subset
          --evidence packages/api-worker/dist/route-proof

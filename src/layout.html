<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  {{canonical_tag}}
  {{social_tags}}
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="preload" href="/assets/fonts/instrument-sans-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/jetbrains-mono-latin-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/tokens.css">
  <link rel="stylesheet" href="/assets/site.css">
  <script src="/assets/header.js" defer></script>
</head>
<body class="page-{{page}}">
  <div class="top-sentinel" aria-hidden="true"></div>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      {{docs_toggle}}<a class="brand" href="/"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M11 1 L21 11 L11 21 L1 11 Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 1 L21 11 L11 11 Z M11 21 L1 11 L11 11 Z" fill="var(--color-accent)"/></svg><span>{{site.name}}</span></a>
      <div class="nav-wrap">
        <nav aria-label="Main">
          <ul class="nav-list">
          {{nav}}
          </ul>
        </nav>
      </div>
    </div>
  </header>
  <main id="main">
{{content}}
  </main>
  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>Data licence: <a href="/about/#licence">CC BY 4.0</a> on derived constants, with per-provider attribution.</p>
      <ul class="footer-links">
        <li><a href="/tide-mechanics/">Tide Mechanics</a></li>
        <li><a href="/about/#cite">How to cite</a></li>
        <li><a href="/downloads/#releases">Releases</a></li>
        <li><a href="/about/">Contact</a></li>
        <li><a href="{{site.repoUrl}}/issues">Issues</a></li>
      </ul>
    </div>
  </footer>
</body>
</html>
